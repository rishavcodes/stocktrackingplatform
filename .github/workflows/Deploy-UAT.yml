# EC2 UAT deployment (SSH/SCP + pm2). For ECS, see cicd-rishav.yml
name: Deploy to EC2 (UAT)

on:
  push:
    branches: [rishav]

env:
  DEPLOY_PATH: /var/www/tradebox-api

jobs:
  deploy-uat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Strip node_modules before upload
        # Avoid tarring the hundreds-of-MB CI node_modules tree, which
        # includes transient/deprecated nested dirs (e.g. phantomjs-prebuilt)
        # that cause drone-scp's tar to abort with "Cannot stat". The server
        # reinstalls prod deps via `npm ci --omit=dev` after the upload.
        run: rm -rf node_modules
        working-directory: server

      - name: Check SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_UAT }}
          username: ${{ secrets.EC2_USERNAME_UAT }}
          key: ${{ secrets.EC2_PRIVATE_KEY_UAT }}
          script: |
            echo "SSH connection successful"
            whoami

      - name: Create target directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_UAT }}
          username: ${{ secrets.EC2_USERNAME_UAT }}
          key: ${{ secrets.EC2_PRIVATE_KEY_UAT }}
          script: |
            sudo mkdir -p ${{ env.DEPLOY_PATH }}
            sudo chown -R ${{ secrets.EC2_USERNAME_UAT }}:${{ secrets.EC2_USERNAME_UAT }} ${{ env.DEPLOY_PATH }}

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_UAT }}
          username: ${{ secrets.EC2_USERNAME_UAT }}
          key: ${{ secrets.EC2_PRIVATE_KEY_UAT }}
          source: "server"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 0
          overwrite: true

      - name: Setup and run application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_UAT }}
          username: ${{ secrets.EC2_USERNAME_UAT }}
          key: ${{ secrets.EC2_PRIVATE_KEY_UAT }}
          script: |
            export NVM_DIR="/home/${{ secrets.EC2_USERNAME_UAT }}/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
            cd ${{ env.DEPLOY_PATH }}/server
            npm ci --omit=dev
            pm2 restart tradebox-api --update-env || pm2 start dist/index.js --name tradebox-api
